9 7"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style="font-size:14.5px;font-weight:600;color:#5C4A42;text-wrap:pretty">{{ k.text }}<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style="margin-top:18px;background:#FBE8B8;border-radius:16px;padding:16px;font-size:14px;line-height:1.5;color:#7A5A20;text-wrap:pretty">Se algo ainda não apareceu, tudo bem. Isso é um mapa, não um prazo.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- PLANOS -->\n  <sc-if value="{{ isPlans }}" hint-placeholder-val="{{ false }}">\n  <div class="nn-scroll" style="position:absolute;inset:0;overflow-y:auto;background:#FFF9F2">\n    <div style="padding:60px 20px 126px">\n      <button sc-camel-on-click="{{ goHome }}" style="width:40px;height:40px;border-radius:999px;border:none;background:#fff;box-shadow:0 2px 10px rgba(92,74,66,.08);cursor:pointer;display:flex;align-items:center;justify-content:center">\n        <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5C4A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <div style="margin-top:18px;font-family:'Fredoka',sans-serif;font-size:28px;line-height:1.2;font-weight:600;color:#2B211D">Continue com a Ninna por perto<\u002Fdiv>\n      <div style="margin-top:8px;font-size:15px;line-height:1.5;color:#8A6A60;text-wrap:pretty">Sem pressa e sem pressão. Experimente do jeito que fizer sentido pra você.<\u002Fdiv>\n\n      <div style="margin-top:24px;position:relative;border:2px solid #E15C42;border-radius:24px;background:#fff;padding:22px 20px 20px;box-shadow:0 12px 30px rgba(225,92,66,.14)">\n        <div style="position:absolute;top:-13px;left:20px;background:#E15C42;color:#FFF3E9;font-size:11.5px;font-weight:800;letter-spacing:.4px;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:5px">\n          <svg width="12" h sinar mensalmente<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style="margin-top:18px;font-size:12.5px;line-height:1.6;color:#8A6A60;text-align:center;text-wrap:pretty">Sem cobrança durante os 7 dias de teste. Você pode cancelar quando quiser, direto no seu celular.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- INSIGHTS -->\n  <sc-if value="{{ isInsights }}" hint-placeholder-val="{{ false }}">\n  <div class="nn-scroll" style="position:absolute;inset:0;overflow-y:auto;background:#FFFDFA">\n    <div style="padding:56px 20px 126px">\n      <div style="font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;color:#2B211D;line-height:1.15">O que a Ninna aprendeu<\u002Fdiv>\n      <div style="margin-top:6px;font-size:14.5px;line-height:1.5;color:#8A6A60;text-wrap:pretty">Tudo aqui vem dos registros da {{ babyLabel }} — nada de dica genérica.<\u002Fdiv>\n\n      <div sc-camel-on-click="{{ toggleMonitor }}" style="margin-top:20px;border-radius:24px;padding:20px;cursor:pointer;background:{{ monBg }};border:1.5px solid {{ monBorder }};box-shadow:{{ monShadow }}">\n        <div style="display:flex;align-items:center;gap:8px">\n          <span style="position:relative;width:10px;height:10px;display:flex;align-items:center;justify-content:center">\n            <span style="position:absolute;width:10px;height:10px;border-radius:999px;background:{{ monPulse }};animation:nnPulse 2.4s ease-in-out infinite"><\u002Fspan>\n            <span style="width:10px;height:10px;border-radius:999px;background:{{ monPulse }}"><\u002Fspan>\n          <\u002Fspan>\n          <span style="font-size:12.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap;color:{{ monLabelColor }}">{{ monLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style="margin-top:12px;font-size:17px;line-height:1.4;color:{{ monInk }};font-weight:{{ monWeight }};text-wrap:pretty">{{ monText }}<\u002Fdiv>\n        <div style="margin-top:16px;display:flex;flex-direction:column;gap:2px">\n          <sc-for list="{{ predictions }}" as="q" hint-placeholder-count="3">\n          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid {{ monLine }}">\n            <span style="width:32px;height:32px;flex:none;border-radius:999px;background:{{ monChip }};display:flex;align-items:center;justify-content:center">\n              <svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="{{ q.tint }}" fill-rule="evenodd"><path d="{{ q.d }}"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <div style="flex:1;min-width:0">\n              <div style="font-size:12px;font-weight:700;letter-spacing:.3px;color:{{ monSub }};line-height:1.2">{{ q.label }}<\u002Fdiv>\n              <div style="margin-top:4px;display:flex;align-items:baseline;gap:8px">\n                <span style="font-family:'Fredoka',sans-serif;font-size:22px;font-weight:600;color:{{ monInk }};line-height:1.05;white-space:nowrap">{{ q.rel }}<\u002Fspan>\n                <span style="font-size:13px;font-weight:600;color:{{ monSub }};white-space:nowrap">{{ q.abs }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style="margin-top:24px;font-family:'Fredoka',sans-serif;font-size:19px;font-weight:600;color:#2B211D">Padrões observados<\u002Fdiv>\n      <div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">\n        <sc-for list="{{ patterns }}" as="i" hint-placeholder-count="4">\n        <div style="border-radius:20px;background:{{ i.bg }};padding:16px;display:flex;align-items:flex-start;gap:14px">\n          <span style="width:40px;height:40px;flex:none;border-radius:999px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center">\n            <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="{{ i.ink }}" fill-rule="evenodd"><path d="{{ i.d }}"><\u002Fpath><\u002Fsvg>\n
